# 3D Three-Layer Partially Connected Mesh
# Topology: 3 layers (4x4 each), modeled as 3 chiplets with dim_z=1
# Vertical links are partially connected (not every router has a VL)
#
# Vertical link pairs are written as [src_local_id, dst_local_id]
# For a 4x4 grid (z=0):
#   y=3: [12][13][14][15]
#   y=2: [ 8][ 9][10][11]
#   y=1: [ 4][ 5][ 6][ 7]
#   y=0: [ 0][ 1][ 2][ 3]
#          x=0 x=1 x=2 x=3

topology: MULTI_MESH

multi_mesh:
  #Bottom layer --> Base interposer
  Layer0: 
    dim_x: 4
    dim_y: 4
    dim_z: 1
    n_virtual_channels: 2
    vertical_links_placement:
      up:
        Layer1:
          # [src in Layer0, dst in Layer1]
          - [ 0,  0]  # (x=0,y=0) -> (x=0,y=0)
          - [ 3,  3]  # (x=3,y=0) -> (x=3,y=0)
          - [ 2,  2]  # (x=2,y=0) -> (x=2,y=0)
          - [ 5,  5]  # (x=1,y=1) -> (x=1,y=1)
          - [10, 10]  # (x=2,y=2) -> (x=2,y=2)
          - [15, 15]  # (x=3,y=3) -> (x=3,y=3)

  # Middle layer
  Layer1: 
    dim_x: 4
    dim_y: 4
    dim_z: 1
    n_virtual_channels: 2
    vertical_links_placement:
      up:
        Layer2:
          # [src in Layer1, dst in Layer2]
          - [ 0,  0]  # (x=0,y=0) -> (x=0,y=0)
          - [ 2,  2]  # (x=2,y=0) -> (x=2,y=0)
          - [ 5,  5]  # (x=1,y=1) -> (x=1,y=1)
          - [10, 10]  # (x=2,y=2) -> (x=2,y=2)
      down:
          # [src in Layer1, dst in Layer0]
          # Must mirror the 'up' entries defined in Layer0
          - [ 0,  0]
          - [ 3,  3]
          - [ 2,  2]
          - [ 5,  5]
          - [10, 10]
          - [15, 15]

  #Top layer
  Layer2: 
    dim_x: 4
    dim_y: 4
    dim_z: 1
    n_virtual_channels: 2
    vertical_links_placement:
      down:
          # [src in Layer2, dst in Layer1]
          # Must mirror the 'up' entries defined in Layer1
          - [ 0,  0]
          - [ 2,  2]
          - [ 5,  5]
          - [10, 10]

# number of flits for each router buffer
buffer_depth: 4
# size of flits, in bits
flit_size: 32
# length in mm of router to hub (vertical link) connection
r2h_link_length: 2.0
# length in mm of router to router connection
r2r_link_length: 1.0
n_virtual_channels: 2


routing_algorithm: DEPTH_FIRST
routing_table_filename: ''

# Routing specific parameters
dyad_threshold: 0.6

# Selection Strategies:
#   RANDOM
#   BUFFER_LEVEL
#   NOP
# We have chosen buffer level, as we want to see which port has more free space when we chose 
selection_strategy: BUFFER_LEVEL
# If set to false, the multi-noc routing algorithm uses an internal arbiter to
# choose between available routing paths and the selection strategy is not used.
route_using_selection_strategy: true
enable_vc_reallocation: true

# SIMULATION PARAMETERS
clock_period_ps: 1000
# duration of reset signal assertion, expressed in cycles
reset_time: 1
# overall simulation length, expressed in cycles
simulation_time: 10000
# Number of cycles the simulation will continue to 'drain' the networks.
# In this stage, each PE can just emit the remaining packets of their packet
# queues, but cannot inject new ones.
drain_time: 0
# collect stats after a given number of cycles
stats_warm_up_time: 0
# power breakdown, nodes communication details
detailed: false
# stop after a given amount of load has been processed
max_volume_to_be_drained: 0
show_buffer_stats: false

# Winoc — disabled
use_winoc: false
use_wirxsleep: false

# Verbosity level:
#   VERBOSE_OFF
#   VERBOSE_LOW
#   VERBOSE_MEDIUM
#   VERBOSE_HIGH
verbose_mode: VERBOSE_OFF
# Trace
trace_mode: false
trace_filename: ''

min_packet_size: 8
max_packet_size: 8
packet_injection_rate: 0.005
probability_of_retransmission: 0.01

# Traffic distribution:
#   TRAFFIC_RANDOM
#   TRAFFIC_TRANSPOSE1
#   TRAFFIC_TRANSPOSE2
#   TRAFFIC_HOTSPOT
#   TRAFFIC_TABLE_BASED
#   TRAFFIC_BIT_REVERSAL
#   TRAFFIC_SHUFFLE
#   TRAFFIC_BUTTERFLY
#   TRAFFIC_SINGLE_PACKET
#   TRAFFIC_LOCAL_CHIPLET
traffic_distribution: TRAFFIC_RANDOM
# for single packet traffic only — 'chip' fields are mandatory for MULTI_MESH
traffic_single_packet_src_lid: 0
traffic_single_packet_src_chip: Layer0
traffic_single_packet_dst_lid: 15
traffic_single_packet_dst_chip: Layer2
# For TRAFFIC_LOCAL_CHIPLET, ratio of flits sent on the same chiplet
traffic_localized_chiplet_ratio: 0.7
# when traffic table based is specified, use the following file
traffic_table_filename: t.txt
